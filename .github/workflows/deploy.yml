name: Тесты и выкладка

on:
  push:
    branches: [master]
    paths-ignore: ['ios/**', '**.md']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Сборка фронтенда
        run: npm run build

      - name: Тесты
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  # Выкладка на сервер. Включается, когда в Settings → Secrets → Actions заданы
  # SSH_HOST, SSH_USER и SSH_KEY (закрытый ключ, которому разрешён вход на сервер).
  deploy:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - name: Проверка настроек
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Секреты SSH_HOST / SSH_USER / SSH_KEY не заданы — выкладка пропущена."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Обновление сайта на сервере
        if: steps.check.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'sudo bash /var/www/bno/deploy/deploy.sh'
