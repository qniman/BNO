# Проект Xcode генерируется из этого файла: `xcodegen generate` (см. ios/README.md).
name: BNO
options:
  bundleIdPrefix: ru.bno
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  BNO:
    type: application
    platform: iOS
    sources:
      - path: BNO
    settings:
      base:
        PRODUCT_NAME: BNO
        PRODUCT_BUNDLE_IDENTIFIER: ru.bno.archive
        INFOPLIST_FILE: BNO/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
